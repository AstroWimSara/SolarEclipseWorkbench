[project]
name = "solareclipseworkbench"
version = "2.0.0"

description = "Tools to photograph solar eclipses"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Sara Regibo", email = "sararegibo@gmail.com" },
    { name = "Wim De Meester", email = "deepskywim@gmail.com" },
]
keywords = ["astronomy", "photography", "solar eclipse"]
requires-python = ">=3.11"
dependencies = [
    "astropy==8.0.2",
    "geopandas==1.2.0",
    "matplotlib==3.11.2",
    "gphoto2==2.6.4",
    "apscheduler==3.11.3",
    "geodatasets==2026.10.0",
    "jplephem==2.24",
    "skyfield==1.55",
    "skyfield-data==7.0.0",
    "timezonefinder==9.0.0",
    "playsound3==3.3.2",
    "pyqt6==6.12.0",
    "pytz==2026.6",
    "pyserial==3.5",
    "pynmea2==1.19.0",
    "geopy==2.5.0",
    "astropy-iers-data==0.2026.11.2.0.34.55",
    "requests==2.34.2",
]

[project.urls]
Repository = "https://github.com/AstroWimSara/SolarEclipseWorkbench"

[project.scripts]
sew = "solareclipseworkbench.gui:main"
sew_wizard = "solareclipseworkbench.wizard:main"
sew_hardware = "solareclipseworkbench.hardware_console:main"

# Relay backends for the USB relay shutter trigger.  The built-in backends
# register themselves on import; this group lets a board type ship in its own
# package.  A backend supplies only "close a contact" and "open a contact": the
# shutter timing and the release of the contacts on exit stay in RelayTrigger.
[project.entry-points."solareclipseworkbench.relay_backends"]
lcus = "solareclipseworkbench.relay_trigger:LcusSerialBackend"
dsd = "solareclipseworkbench.relay_trigger:DsdSerialBackend"
numato = "solareclipseworkbench.relay_trigger:NumatoSerialBackend"
hid = "solareclipseworkbench.relay_trigger:HidRelayBackend"
simulated = "solareclipseworkbench.relay_trigger:SimulatedBackend"

[project.optional-dependencies]
# HID relay boards (dcttech "USBRelay" boards, 16c0:05df).  'hidapi' ships the
# shared library in its wheel.  The similarly named 'hid' package gives the same
# import, but needs the library installed on the system.
hid = ["hidapi==0.15.0"]

[dependency-groups]
dev = ["pytest>=9"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"solareclipseworkbench" = [
    "sound/**",
    "example_scripts/**",
    "img/**",
    "*.bsp",
    "*.csv",
]

